name: Build Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build_script: dist:linux
            artifact_name: Entrance-Desktop-linux
            artifact_paths: |
              Desktop/dist/*.AppImage
              Desktop/dist/*.deb
              Desktop/dist/*.rpm
          - os: windows-latest
            build_script: dist:win
            artifact_name: Entrance-Desktop-windows
            artifact_paths: |
              Desktop/dist/*.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            Entrance/package-lock.json
            Desktop/package-lock.json

      - name: Install backend dependencies
        working-directory: Entrance
        run: npm ci

      - name: Install desktop dependencies
        working-directory: Desktop
        run: npm ci

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Build desktop package
        working-directory: Desktop
        run: npm run ${{ matrix.build_script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error
