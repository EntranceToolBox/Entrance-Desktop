name: Build Desktop

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"
  push:
    branches:
      - "**"

jobs:
  build:
    runs-on: ${{ matrix.os }}
    env:
      ELECTRON_CACHE: ${{ runner.temp }}/electron-cache
      ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      npm_config_fetch_retries: "5"
      npm_config_fetch_retry_factor: "2"
      npm_config_fetch_retry_mintimeout: "20000"
      npm_config_fetch_retry_maxtimeout: "120000"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build_script: dist:linux
            artifact_name: Entrance-Desktop-linux
            artifact_paths: |
              Desktop/dist/*.AppImage
              # Desktop/dist/*.deb
              # Desktop/dist/*.rpm
          - os: windows-latest
            build_script: dist:win
            artifact_name: Entrance-Desktop-windows
            artifact_paths: |
              Desktop/dist/*.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            Entrance/package-lock.json
            Desktop/package-lock.json

      - name: Install backend dependencies
        working-directory: Entrance
        run: npm ci --no-audit --no-fund

      - name: Install desktop dependencies
        working-directory: Desktop
        run: npm ci --no-audit --no-fund

      - name: Build desktop package (Linux)
        if: runner.os == 'Linux'
        working-directory: Desktop
        run: npm run ${{ matrix.build_script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Build desktop package (non-Linux)
        if: runner.os != 'Linux'
        working-directory: Desktop
        run: npm run ${{ matrix.build_script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error
