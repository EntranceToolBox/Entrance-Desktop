name: Build Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            Entrance/package-lock.json
            Desktop/package-lock.json

      - name: Install backend dependencies
        working-directory: Entrance
        run: npm install

      - name: Install desktop dependencies
        working-directory: Desktop
        run: npm install

      - name: Build desktop package
        working-directory: Desktop
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Entrance-Desktop-${{ matrix.os }}
          path: Desktop/dist/*
