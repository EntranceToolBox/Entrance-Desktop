name: Build ASAR

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-asar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            Entrance/package-lock.json
            Desktop/package-lock.json

      - name: Install backend dependencies
        working-directory: Entrance
        run: npm ci

      - name: Install desktop dependencies
        working-directory: Desktop
        run: npm ci

      - name: Build unpacked app
        working-directory: Desktop
        run: npm run pack
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Collect app.asar
        run: |
          set -euo pipefail
          ASAR_PATH="$(find Desktop/dist -type f -name app.asar | head -n 1)"

          if [ -z "${ASAR_PATH}" ]; then
            echo "app.asar not found under Desktop/dist"
            find Desktop/dist -maxdepth 4 -type f || true
            exit 1
          fi

          mkdir -p Desktop/dist/asar
          cp "${ASAR_PATH}" Desktop/dist/asar/app.asar
          sha256sum Desktop/dist/asar/app.asar > Desktop/dist/asar/app.asar.sha256
          echo "ASAR collected from: ${ASAR_PATH}"

      - name: Upload ASAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: Entrance-Desktop-asar
          path: Desktop/dist/asar/*
